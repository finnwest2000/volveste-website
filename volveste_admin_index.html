<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volveste | RSVP Admin</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#0d0d0d;--line:#333;--muted:#aaa;--white:#f7f7f7;--gold:#C6AE82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
main{width:min(100% - 36px,1000px);margin:0 auto;padding:38px 0 56px}
.dashboard-header{display:flex;align-items:center;flex-direction:column;gap:15px;border-bottom:1px solid #C6AE82;padding-bottom:25px}
.brand{text-align:center;width:100%}.brand-pair{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:18px;width:100%;max-width:500px;margin:0 auto}.brand-side{min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;background:#050505}.volveste-side{flex-direction:column}.mark{width:72px;height:82px;object-fit:contain;display:block;margin:0;border-radius:2px;background:transparent}.vanish-mark{display:block;width:min(100%,150px);height:auto;aspect-ratio:1/1;object-fit:contain;background:#050505;border:0;border-radius:0}.wordmark-image{display:block;width:min(100%,320px);height:auto;max-height:76px;object-fit:contain;margin:0 auto}
.admin-subtitle{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:600;text-align:center}
h1{font-size:clamp(27px,6vw,36px);line-height:1.12;letter-spacing:-.04em;font-weight:600;margin:28px 0 12px}p{font-size:14px;line-height:1.65;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}.stat{border:1px solid var(--gold);border-radius:12px;padding:22px;background:var(--panel);font-size:13px;color:#ddd}.stat strong{display:block;font-size:34px;margin-top:12px;color:var(--white)}
button{border:1px solid var(--gold);background:var(--gold);color:#080808;padding:13px 16px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#refresh{width:100%;max-width:240px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input{flex:1;min-width:170px;background:#080808;color:#fff;border:1px solid #414141;border-radius:6px;padding:13px;font:inherit;font-size:14px}input:focus{outline:1px solid var(--gold)}
.table-wrap{overflow:auto;border:1px solid #414141;border-radius:10px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:750px}th,td{text-align:left;padding:14px;border-bottom:1px solid #333;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--gold)}td{overflow-wrap:anywhere}#status{margin:18px 0;color:var(--muted);font-size:13px}footer{font-size:11px;color:#777;margin-top:26px;line-height:1.6}
@media(max-width:500px){main{padding-top:30px}.stat{padding:15px}.stat strong{font-size:28px}.brand-pair{gap:10px}.mark{width:62px;height:70px}.vanish-mark{width:min(100%,132px)}.wordmark-image{width:min(100%,280px);max-height:68px}.controls button{width:100%}}
</style>
</head>

</header><div class="admin-subtitle">PRIVATE RSVP MANAGEMENT</div><button id="refresh" type="button">Refresh</button></header>
<h1>Guest overview</h1><p>Registration records for your event.</p>
<section class="stats"><div class="stat"><span>Total RSVPs</span><strong id="total">—</strong></div><div class="stat"><span>Marketing opt-ins</span><strong id="optins">—</strong></div></section>
<div class="controls"><input id="search" type="search" placeholder="Search name or email" aria-label="Search guests"><button id="download" type="button" disabled>Download CSV</button></div>
<div id="status" role="status">Waiting to load guest records…</div>
<div class="table-wrap"><table><thead><tr><th>Guest</th><th>Email</th><th>Mobile</th><th>Marketing consent</th><th>Registered</th></tr></thead><tbody id="guests"><tr><td colspan="5">No records loaded yet.</td></tr></tbody></table></div>
<footer>Admin access only · Handle guest contact details confidentially.</footer>
</main><script>
'use strict';
let records=[];
const el=id=>document.getElementById(id);
function filtered(){const q=el('search').value.trim().toLowerCase();return records.filter(r=>[r.full_name,r.email,r.mobile].some(v=>String(v??'').toLowerCase().includes(q)));}
function render(){const rows=filtered(),tbody=el('guests');tbody.replaceChildren();if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='No matching guests.';tr.append(td);tbody.append(tr);return;}for(const r of rows){const tr=document.createElement('tr');for(const value of [((r.title||'')+' '+(r.full_name||'')).trim(),r.email,r.mobile,Number(r.marketing_consent)===1?'Yes':'No',r.submitted_at]){const td=document.createElement('td');td.textContent=String(value??'');tr.append(td);}tbody.append(tr);}}
async function load(){el('status').textContent='Loading registrations…';el('refresh').disabled=true;el('download').disabled=true;try{const response=await fetch('/admin/api/guests',{credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json'}});if(!response.ok)throw new Error('Could not load guest records (HTTP '+response.status+').');const data=await response.json();if(!data.ok||!Array.isArray(data.guests))throw new Error('Unexpected response from guest API.');records=data.guests;el('total').textContent=records.length;el('optins').textContent=records.filter(r=>Number(r.marketing_consent)===1).length;el('status').textContent=records.length+' registrations loaded.';el('download').disabled=false;render();}catch(error){el('status').textContent=error.message+' The protected database connection may not be installed yet.';}finally{el('refresh').disabled=false;}}
function csvCell(value){const s=String(value??'');return '"'+s.replace(/"/g,'""')+'"';}
function download(){const columns=['title','full_name','email','mobile','marketing_consent','submitted_at'];const lines=[columns.map(csvCell).join(','),...filtered().map(r=>columns.map(k=>csvCell(r[k])).join(','))];const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='volveste-rsvps.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
el('search').addEventListener('input',render);el('refresh').addEventListener('click',load);el('download').addEventListener('click',download);load();
</script></body></html>
